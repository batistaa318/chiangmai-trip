<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清邁自由行 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

    <!-- Header / Banner -->
    <header class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span id="trip-badge" class="bg-emerald-800 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wide">載入中...</span>
                    <h1 id="trip-title" class="text-2xl sm:text-3xl font-bold mt-1">清邁自由行</h1>
                    <p id="trip-subtitle" class="text-emerald-100 text-sm mt-0.5">---</p>
                </div>
                <!-- 倒數計時器 -->
                <div class="bg-emerald-800/80 backdrop-blur rounded-xl p-3 border border-emerald-600 text-center min-w-[140px]">
                    <div class="text-xs text-emerald-200">旅程倒數</div>
                    <div id="countdown-timer" class="text-xl font-extrabold text-amber-300">-- 天</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- 航班與預算概覽卡片 -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 航班資訊 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure text-emerald-600"></i> 航班資訊
                </h2>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl">
                        <div>
                            <span class="font-bold text-emerald-700 block" id="outbound-code">--</span>
                            <span class="text-gray-500 text-xs" id="outbound-route">--</span>
                        </div>
                        <div class="text-right text-xs text-gray-600 font-medium" id="outbound-time">--</div>
                    </div>
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl">
                        <div>
                            <span class="font-bold text-emerald-700 block" id="inbound-code">--</span>
                            <span class="text-gray-500 text-xs" id="inbound-route">--</span>
                        </div>
                        <div class="text-right text-xs text-gray-600 font-medium" id="inbound-time">--</div>
                    </div>
                </div>
            </div>

            <!-- 匯率與快快試算 -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold text-gray-700 mb-2 flex items-center justify-between">
                        <span><i class="fa-solid fa-coins text-amber-500"></i> 泰銖/台幣 匯率換算</span>
                        <span id="rate-source" class="text-xs font-normal text-gray-400">---</span>
                    </h2>
                    <p class="text-xs text-gray-500 mb-3">當前參考匯率: <span id="current-rate-display" class="font-bold text-gray-700">--</span></p>
                </div>
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <input type="number" id="thb-input" placeholder="輸入泰銖 (THB)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <button onclick="convertCurrency()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">換算</button>
                    </div>
                    <div id="calc-result" class="text-center py-2 bg-emerald-50 text-emerald-800 rounded-xl font-bold text-sm hidden">
                        約合台幣 TWD <span id="twd-output" class="text-lg text-emerald-700">0</span> 元
                    </div>
                </div>
            </div>
        </section>

        <!-- 每日住宿清單 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-hotel text-emerald-600"></i> 住宿行程規劃
                </h2>
                <span class="text-xs text-gray-400">點擊飯店卡片可編輯或在地圖開啟</span>
            </div>

            <div id="accommodations-list" class="space-y-4">
                <div class="text-center py-8 text-gray-400">資料載入中...</div>
            </div>
        </section>
    </main>

    <!-- 編輯住宿 Modal 彈窗 -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-lg">編輯住宿資訊</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="edit-form" onsubmit="saveAccommodation(event)" class="space-y-3">
                <input type="hidden" id="modal-date">

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">入住日期</label>
                    <input type="text" id="modal-date-display" readonly class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">飯店名稱 *</label>
                    <input type="text" id="modal-hotel-name" required class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">中 / 英文地址</label>
                    <input type="text" id="modal-address" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">泰文地址 (給司機大字展示)</label>
                    <input type="text" id="modal-address-th" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Google 地圖網址 (自動解析經緯度)</label>
                    <input type="url" id="modal-maps-url" placeholder="https://www.google.com/maps/place/..." oninput="previewGeoParse()" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <!-- 經緯度解析預覽 -->
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs text-gray-600 space-y-1">
                    <div class="font-semibold text-gray-700">自動解析座標狀態：</div>
                    <div class="flex justify-between">
                        <span>緯度 (latitude): <strong id="parse-lat" class="text-emerald-700">--</strong></span>
                        <span>經度 (longitude): <strong id="parse-lng" class="text-emerald-700">--</strong></span>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeEditModal()" class="w-1/2 bg-gray-100 text-gray-700 py-2.5 rounded-xl font-medium text-sm hover:bg-gray-200 transition">取消</button>
                    <button type="submit" id="save-btn" class="w-1/2 bg-emerald-600 text-white py-2.5 rounded-xl font-medium text-sm hover:bg-emerald-700 transition">儲存並同步</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Supabase 初始化設定 (請填入您的憑證)
        // ==========================================
        const SUPABASE_URL = 'https://giubriqbequoxwedfsux.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpdWJyaXFiZXF1b3h3ZWRmc3V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDUxNDUsImV4cCI6MjEwNTQ4MTE0NX0.FwHcTeIlD4QfAOLNTQmo2bw8z-OM3QphpSPq3Er-3cc';
        
        const CURRENT_TRIP_ID = 'chiangmai_2026';
        let supabaseClient = null;
        let currentRate = 0.92; // 預設備用匯率

        if (SUPABASE_URL !== 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // ==========================================
        // 2. Google Maps URL 自動解析經緯度核心邏輯
        // ==========================================
        function parseGoogleMapsUrl(url) {
            if (!url) return null;
            
            // 模式 1: @lat,lng (常見於標準 Google Maps 網址)
            const atMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (atMatch) {
                return {
                    lat: parseFloat(parseFloat(atMatch[1]).toFixed(7)),
                    lng: parseFloat(parseFloat(atMatch[2]).toFixed(7))
                };
            }

            // 模式 2: !3dlat!4dlng (常見於分享鏈接與地點詳細頁)
            const d3d4Match = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
            if (d3d4Match) {
                return {
                    lat: parseFloat(parseFloat(d3d4Match[1]).toFixed(7)),
                    lng: parseFloat(parseFloat(d3d4Match[2]).toFixed(7))
                };
            }

            // 模式 3: ?q=lat,lng 或 ll=lat,lng
            const qMatch = url.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (qMatch) {
                return {
                    lat: parseFloat(parseFloat(qMatch[1]).toFixed(7)),
                    lng: parseFloat(parseFloat(qMatch[2]).toFixed(7))
                };
            }

            return null;
        }

        // Modal 內即時預覽解析結果
        function previewGeoParse() {
            const urlInput = document.getElementById('modal-maps-url').value;
            const geo = parseGoogleMapsUrl(urlInput);
            
            if (geo) {
                document.getElementById('parse-lat').innerText = geo.lat;
                document.getElementById('parse-lng').innerText = geo.lng;
            } else {
                document.getElementById('parse-lat').innerText = '未解析到';
                document.getElementById('parse-lng').innerText = '未解析到';
            }
        }

        // ==========================================
        // 3. 頁面初始化與 Supabase 資料載入
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            await loadExchangeRate();
            await fetchTripData();
        });

        // 取得即時匯率
        async function loadExchangeRate() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/THB');
                const data = await res.json();
                if (data && data.rates && data.rates.TWD) {
                    currentRate = data.rates.TWD;
                    document.getElementById('rate-source').innerText = '即時 API';
                }
            } catch (e) {
                document.getElementById('rate-source').innerText = '備用預設';
            }
            document.getElementById('current-rate-display').innerText = `1 THB ≈ ${currentRate.toFixed(4)} TWD`;
        }

        // 從 Supabase 抓取旅程與住宿資料
        async function fetchTripData() {
            if (!supabaseClient) {
                renderFallbackData();
                return;
            }

            try {
                // 讀取 trip_config
                const { data: config } = await supabaseClient
                    .from('trip_config')
                    .select('*')
                    .eq('trip_id', CURRENT_TRIP_ID)
                    .single();

                if (config) renderConfig(config);

                // 讀取 accommodations
                const { data: list } = await supabaseClient
                    .from('accommodations')
                    .select('*')
                    .eq('trip_id', CURRENT_TRIP_ID)
                    .order('date', { ascending: true });

                if (list && list.length > 0) {
                    renderAccommodations(list);
                } else {
                    renderFallbackData();
                }
            } catch (err) {
                console.error('Fetch error:', err);
                renderFallbackData();
            }
        }

        // 渲染旅程主資訊
        function renderConfig(config) {
            document.getElementById('trip-badge').innerText = config.title || 'TRIP';
            document.getElementById('trip-title').innerText = config.subtitle || '自由行';
            
            // 計算倒數天數
            if (config.start_date) {
                const start = new Date(config.start_date);
                const today = new Date();
                const diffTime = start - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('countdown-timer').innerText = diffDays > 0 ? `${diffDays} 天` : '旅程進行中';
            }

            // 航班
            if (config.outbound_flight) {
                document.getElementById('outbound-code').innerText = config.outbound_flight.code;
                document.getElementById('outbound-route').innerText = config.outbound_flight.route;
                document.getElementById('outbound-time').innerText = config.outbound_flight.time;
            }
            if (config.inbound_flight) {
                document.getElementById('inbound-code').innerText = config.inbound_flight.code;
                document.getElementById('inbound-route').innerText = config.inbound_flight.route;
                document.getElementById('inbound-time').innerText = config.inbound_flight.time;
            }
        }

        // 渲染住宿列表
        function renderAccommodations(items) {
            const container = document.getElementById('accommodations-list');
            container.innerHTML = '';

            items.forEach((item, idx) => {
                const hasGeo = item.latitude && item.longitude;
                const mapUrl = item.google_maps_url || (hasGeo ? `https://www.google.com/maps/search/?api=1&query=${item.latitude},${item.longitude}` : '#');

                const card = document.createElement('div');
                card.className = "p-4 border border-gray-100 rounded-xl bg-gray-50/50 hover:bg-white hover:shadow-md transition space-y-2";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">Day ${idx + 1} · ${item.date}</span>
                            <h3 class="font-bold text-gray-800 text-base mt-1">${item.hotel_name}</h3>
                        </div>
                        <button onclick='openEditModal(${JSON.stringify(item)})' class="text-xs text-gray-400 hover:text-emerald-600 bg-white border border-gray-200 px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-pen-to-square"></i> 編輯
                        </button>
                    </div>

                    ${item.address ? `<p class="text-xs text-gray-600 flex items-center gap-1"><i class="fa-solid fa-location-dot text-gray-400"></i> ${item.address}</p>` : ''}
                    ${item.address_th ? `<p class="text-xs text-emerald-800 font-medium bg-emerald-50/80 p-1.5 rounded-lg">泰文地址: ${item.address_th}</p>` : ''}

                    <div class="flex items-center justify-between pt-2 border-t border-gray-100 text-xs">
                        <span class="text-gray-400">
                            ${hasGeo ? `<i class="fa-solid fa-circle-check text-emerald-500"></i> 已記錄經緯度 (${item.latitude},${item.longitude})` : '<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 未定位經緯度'}
                        </span>
                        ${item.google_maps_url ? `
                            <a href="${mapUrl}" target="_blank" class="text-emerald-700 font-semibold hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-map-location-dot"></i> 在地圖開啟
                            </a>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 預設純前端備用資料
        function renderFallbackData() {
            document.getElementById('trip-badge').innerText = 'BROTHERS TRIP';
            document.getElementById('trip-title').innerText = '清邁 9天8夜 自由行';
            document.getElementById('countdown-timer').innerText = '倒數中';
            
            const fallbackList = [
                { date: '2026-10-09', hotel_name: 'InterContinental Chiang Mai The Mae Ping', address: '153 Sridonchai Rd', google_maps_url: '', latitude: 18.7818456, longitude: 98.9998071 },
                { date: '2026-10-12', hotel_name: 'U Nimman Chiang Mai', address: '1 Nimmanhaemin Road', google_maps_url: '', latitude: 18.8006579, longitude: 98.9679880 }
            ];
            renderAccommodations(fallbackList);
        }

        // ==========================================
        // 4. Modal 彈窗控制與 Upsert 寫回資料庫
        // ==========================================
        function openEditModal(item) {
            document.getElementById('modal-date').value = item.date;
            document.getElementById('modal-date-display').value = item.date;
            document.getElementById('modal-hotel-name').value = item.hotel_name || '';
            document.getElementById('modal-address').value = item.address || '';
            document.getElementById('modal-address-th').value = item.address_th || '';
            document.getElementById('modal-maps-url').value = item.google_maps_url || '';
            
            previewGeoParse();
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
        }

        async function saveAccommodation(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = '儲存中...';
            saveBtn.disabled = true;

            const date = document.getElementById('modal-date').value;
            const hotelName = document.getElementById('modal-hotel-name').value;
            const address = document.getElementById('modal-address').value;
            const addressTh = document.getElementById('modal-address-th').value;
            const mapsUrl = document.getElementById('modal-maps-url').value;

            // 自動解析經緯度
            const geo = parseGoogleMapsUrl(mapsUrl);

            const payload = {
                trip_id: CURRENT_TRIP_ID,
                date: date,
                hotel_name: hotelName,
                address: address || null,
                address_th: addressTh || null,
                google_maps_url: mapsUrl || null,
                latitude: geo ? geo.lat : null,
                longitude: geo ? geo.lng : null
            };

            if (supabaseClient) {
                const { error } = await supabaseClient
                    .from('accommodations')
                    .upsert([payload], { onConflict: 'trip_id,date' });

                if (error) {
                    alert('儲存失敗：' + error.message);
                } else {
                    await fetchTripData();
                    closeEditModal();
                }
            } else {
                alert('未設定 Supabase 憑證，僅在本地展示');
                closeEditModal();
            }

            saveBtn.innerText = '儲存並同步';
            saveBtn.disabled = false;
        }

        // ==========================================
        // 5. 匯率計算機
        // ==========================================
        function convertCurrency() {
            const thb = parseFloat(document.getElementById('thb-input').value);
            if (!isNaN(thb) && thb > 0) {
                const twd = Math.round(thb * currentRate);
                document.getElementById('twd-output').innerText = twd.toLocaleString();
                document.getElementById('calc-result').classList.remove('hidden');
            } else {
                document.getElementById('calc-result').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
