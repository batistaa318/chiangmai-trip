<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清邁行程與旅費記帳工具</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <div class="max-w-2xl mx-auto px-4 py-6">
    
    <!-- 頁面標頭 -->
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center justify-center gap-2">
        <span>✈️ 清邁自由行夥伴</span>
      </h1>
      <p class="text-xs text-slate-500 mt-1">行程規劃 · 景點導覽 · 團隊分帳</p>
    </header>

    <!-- ------------------------------------------------------------------ -->
    <!-- 旅費分帳 / 記帳小工具 (優化版 UI：支援收折與 Tab 分頁) -->
    <!-- ------------------------------------------------------------------ -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 mb-6 overflow-hidden transition-all duration-300">
      
      <!-- 1. 可點擊收折的標題列 -->
      <button id="expense-toggle-btn" onclick="toggleExpenseSection()" class="w-full px-5 py-4 bg-slate-50 hover:bg-slate-100/80 flex items-center justify-between border-b border-slate-100 transition-colors text-left outline-none">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 flex items-center justify-center font-bold text-sm">
            <i class="fa-solid fa-calculator"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-sm sm:text-base leading-tight">旅費分帳 / 記帳小工具</h3>
            <p class="text-[11px] text-slate-400 mt-0.5" id="sync-status">點擊可展開或收折記帳面板</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="expense-count" class="text-[10px] bg-amber-100 text-amber-800 font-extrabold px-2 py-0.5 rounded-full">0 筆</span>
          <i id="expense-chevron" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-300"></i>
        </div>
      </button>

      <!-- 2. 主體內容區域 (可收折) -->
      <div id="expense-content" class="p-4 sm:p-5">
        
        <!-- Tab 切換選單 -->
        <div class="flex border-b border-slate-200 mb-4 gap-4 text-xs font-bold">
          <button onclick="switchTab('add')" id="tab-btn-add" class="pb-2 border-b-2 border-amber-500 text-amber-600 transition-colors flex items-center gap-1.5 outline-none">
            <i class="fa-solid fa-plus-circle"></i> 新增消費
          </button>
          <button onclick="switchTab('summary')" id="tab-btn-summary" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1.5 outline-none">
            <i class="fa-solid fa-chart-pie"></i> 拆帳總覽
          </button>
          <button onclick="switchTab('list')" id="tab-btn-list" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1.5 outline-none">
            <i class="fa-solid fa-list-ul"></i> 明細紀錄
          </button>
        </div>

        <!-- Panel 1: 新增記帳表單 -->
        <div id="panel-add" class="space-y-3">
          <div class="grid grid-cols-2 gap-2 sm:gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1">付款人</label>
              <select id="expense-payer" onchange="selectedPayerId = this.value" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-amber-500 outline-none"></select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1">金額 (THB 泰銖)</label>
              <input type="number" id="expense-amount" placeholder="0" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-bold text-slate-900 focus:ring-1 focus:ring-amber-500 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 sm:gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1">類別</label>
              <select id="expense-category" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-amber-500 outline-none">
                <option value="吃">🍔 餐飲美食</option>
                <option value="喝">🍹 飲料點心</option>
                <option value="車">🚕 交通車資</option>
                <option value="其他">🛍️ 購物娛樂</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 mb-1">備註/品名</label>
              <input type="text" id="expense-note" placeholder="例：鳳飛飛豬腳飯" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-amber-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">平分參與人 (可複選)</label>
            <div id="expense-splitters" class="flex flex-wrap gap-1.5 py-1"></div>
          </div>

          <button onclick="addExpense()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-lg shadow-sm transition-all active:scale-[0.99] flex items-center justify-center gap-1.5 mt-2">
            <i class="fa-solid fa-check"></i> 儲存並同步到 Google Sheet
          </button>
        </div>

        <!-- Panel 2: 拆帳與累積金額總覽 -->
        <div id="panel-summary" class="hidden">
          <div id="expense-summary"></div>
        </div>

        <!-- Panel 3: 歷史消費清單 -->
        <div id="panel-list" class="hidden">
          <div id="expense-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>

      </div>
    </section>

    <!-- 行程列表展示區 (原本的行程) -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
      <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
        <i class="fa-solid fa-map-location-dot text-indigo-500"></i> 行程概覽
      </h3>
      <div id="itinerary-list" class="text-xs text-slate-400 py-4 text-center">
        <i class="fa-solid fa-spinner fa-spin"></i> 載入行程資料中...
      </div>
    </section>

  </div>

  <!-- 邏輯處理腳本 -->
  <script>
    // ⚠️ 請填入你的 Google Apps Script Web App 網址 (/exec 結尾)
    const API_URL = "YOUR_GAS_DEPLOYMENT_URL_HERE"; 
    
    const thbToTwdRate = 0.92; // 泰銖轉台幣預估匯率
    const currencySymbols = { 'THB': '฿', 'TWD': 'NT$' };

    let members = [];
    let expenses = [];
    let defaultCurrency = 'THB';
    let selectedPayerId = '';
    let selectedSplitters = [];

    // 預備成員 fallback（防止網路不良時卡死）
    const fallbackMembers = [
      { MemberId: 'M1', Name: '成員A', Avatar: '👦', Status: 'Active' },
      { MemberId: 'M2', Name: '成員B', Avatar: '👨', Status: 'Active' },
      { MemberId: 'M3', Name: '成員C', Avatar: '🧔', Status: 'Active' }
    ];

    // 頁面初始化
    document.addEventListener('DOMContentLoaded', () => {
      fetchItinerary();
      syncExpensesFromSheet();
    });

    // 1. 收折面板控制
    function toggleExpenseSection() {
      const content = document.getElementById('expense-content');
      const chevron = document.getElementById('expense-chevron');
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        chevron.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('hidden');
        chevron.style.transform = 'rotate(-90deg)';
      }
    }

    // 2. Tab 切換控制
    function switchTab(tabName) {
      const tabs = ['add', 'summary', 'list'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        const panel = document.getElementById(`panel-${t}`);
        if (t === tabName) {
          panel.classList.remove('hidden');
          btn.classList.add('border-amber-500', 'text-amber-600');
          btn.classList.remove('border-transparent', 'text-slate-400');
        } else {
          panel.classList.add('hidden');
          btn.classList.remove('border-amber-500', 'text-amber-600');
          btn.classList.add('border-transparent', 'text-slate-400');
        }
      });
    }

    // 3. 從 Google Sheet 同步成員與記帳資料
    async function syncExpensesFromSheet() {
      const syncStatusEl = document.getElementById('sync-status');
      syncStatusEl.innerHTML = `<span class="text-amber-600"><i class="fa-solid fa-arrows-rotate fa-spin"></i> 同步資料中...</span>`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒超時機制

        const res = await fetch(`${API_URL}?action=getExpensesData`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data.status === 'success' && data.members && data.members.length > 0) {
          members = data.members;
          expenses = data.expenses || [];
          defaultCurrency = data.currency || 'THB';
          syncStatusEl.innerText = '點擊可展開或收折記帳面板';
        } else {
          throw new Error('回傳資料無效');
        }
      } catch (err) {
        console.warn('GAS 讀取失敗，使用離線預設備用資料:', err);
        if (members.length === 0) members = fallbackMembers;
        syncStatusEl.innerText = '使用離線預設成員';
      } finally {
        const activeMembers = members.filter(m => m.Status !== 'Left');
        if (activeMembers.length > 0 && !selectedPayerId) {
          selectedPayerId = activeMembers[0].MemberId;
        }
        if (selectedSplitters.length === 0) {
          selectedSplitters = activeMembers.map(m => m.MemberId);
        }
        renderFormUI();
        renderExpenses();
      }
    }

    // 4. 渲染表單 UI (選單與成員按鈕)
    function renderFormUI() {
      const payerSelect = document.getElementById('expense-payer');
      const splittersDiv = document.getElementById('expense-splitters');
      const activeMembers = members.filter(m => m.Status !== 'Left');

      payerSelect.innerHTML = activeMembers.map(m => 
        `<option value="${m.MemberId}" ${m.MemberId === selectedPayerId ? 'selected' : ''}>${m.Avatar} ${m.Name}</option>`
      ).join('');

      splittersDiv.innerHTML = activeMembers.map(m => {
        const isSelected = selectedSplitters.includes(m.MemberId);
        return `
          <button type="button" onclick="toggleSplitter('${m.MemberId}')" class="px-2.5 py-1 text-xs rounded-full border transition-all ${
            isSelected 
              ? 'bg-amber-500 text-white border-amber-500 font-bold shadow-2xs' 
              : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
          }">
            ${m.Avatar} ${m.Name}
          </button>
        `;
      }).join('');
    }

    function toggleSplitter(id) {
      if (selectedSplitters.includes(id)) {
        if (selectedSplitters.length === 1) return; // 至少要留一人
        selectedSplitters = selectedSplitters.filter(sId => sId !== id);
      } else {
        selectedSplitters.push(id);
      }
      renderFormUI();
    }

    // 5. 核心：計算並渲染拆帳與個人總累積花費
    function renderExpenses() {
      const listEl = document.getElementById('expense-list');
      const summaryEl = document.getElementById('expense-summary');
      const countEl = document.getElementById('expense-count');

      countEl.innerText = `${expenses.length} 筆`;

      if (expenses.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-slate-400 py-6 text-center border border-dashed border-slate-200 rounded-lg">尚無消費明細</p>`;
        summaryEl.innerHTML = `<p class="text-xs text-slate-500 py-4 text-center">尚無記帳資料，輸入項目後將自動為您統計結算。</p>`;
        return;
      }

      const memberMap = {};
      members.forEach(m => { memberMap[m.MemberId] = m; });
      const currSymbol = currencySymbols[defaultCurrency] || defaultCurrency;

      // 渲染歷史明細 Tab
      listEl.innerHTML = expenses.slice().reverse().map(exp => {
        const payer = memberMap[exp.PayerId] || { Name: exp.PayerId, Avatar: '👤' };
        const splitIds = (exp.SplitWith || '').split(',').filter(Boolean);
        const splitAvatars = splitIds.map(id => (memberMap[id] ? memberMap[id].Avatar : '')).join(' ');

        const catIconMap = { '吃': '🍔', '喝': '🍹', '車': '🚕', '其他': '🛍️' };
        const catIcon = catIconMap[exp.Category] || '📝';
        const twdEst = defaultCurrency === 'THB' ? `≈ NT$ ${Math.round(exp.Amount * thbToTwdRate)}` : '';

        return `
          <div class="bg-slate-50 border border-slate-200/80 p-2.5 rounded-xl flex justify-between items-center text-xs">
            <div class="flex-1 pr-2">
              <div class="font-bold text-slate-800 flex items-center gap-1.5">
                <span>${catIcon} ${exp.Note || exp.Category}</span>
                <span class="text-[10px] bg-slate-200/70 text-slate-600 px-1.5 py-0.2 rounded font-normal">${exp.Category}</span>
              </div>
              <p class="text-[10px] text-slate-400 mt-0.5">
                由 <strong class="text-slate-700">${payer.Avatar}${payer.Name}</strong> 付款 · 平分: ${splitAvatars || '所有人'}
              </p>
            </div>
            <div class="text-right">
              <span class="font-extrabold text-slate-900 block">${currSymbol}${exp.Amount}</span>
              ${twdEst ? `<span class="text-[10px] text-slate-400 block">${twdEst}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');

      // 計算各成員墊款與累積應付
      const paidMap = {};
      const owedMap = {};
      members.forEach(m => { paidMap[m.MemberId] = 0; owedMap[m.MemberId] = 0; });

      let totalSpent = 0;
      expenses.forEach(exp => {
        const amt = parseFloat(exp.Amount) || 0;
        totalSpent += amt;

        if (paidMap[exp.PayerId] !== undefined) paidMap[exp.PayerId] += amt;
        else paidMap[exp.PayerId] = amt;

        const splitIds = (exp.SplitWith || '').split(',').filter(Boolean);
        if (splitIds.length > 0) {
          const splitShare = amt / splitIds.length;
          splitIds.forEach(id => {
            if (owedMap[id] !== undefined) owedMap[id] += splitShare;
            else owedMap[id] = splitShare;
          });
        }
      });

      // 找補演算法
      const debtors = [];
      const creditors = [];
      Object.keys(paidMap).forEach(id => {
        const net = paidMap[id] - (owedMap[id] || 0);
        if (net < -0.1) debtors.push({ id, amount: Math.abs(net) });
        else if (net > 0.1) creditors.push({ id, amount: net });
      });

      const transactions = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const debtor = debtors[i];
        const creditor = creditors[j];
        const minAmt = Math.min(debtor.amount, creditor.amount);

        transactions.push({ from: debtor.id, to: creditor.id, amount: Math.round(minAmt) });
        debtor.amount -= minAmt;
        creditor.amount -= minAmt;

        if (debtor.amount < 0.1) i++;
        if (creditor.amount < 0.1) j++;
      }

      // 渲染拆帳總覽 Tab
      let resultHtml = `
        <div class="mb-3 pb-2 border-b border-amber-200/60 flex justify-between items-center text-xs">
          <span>全團總消費: <strong class="text-slate-900 text-sm">${currSymbol}${Math.round(totalSpent)}</strong> ${defaultCurrency === 'THB' ? `<span class="text-[10px] text-slate-400">(≈NT$ ${Math.round(totalSpent * thbToTwdRate)})</span>` : ''}</span>
          <span class="text-[10px] text-slate-500">成員: ${members.length} 人</span>
        </div>

        <div class="mb-3">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">個人累積應付總額 (含平分)</span>
          <div class="grid grid-cols-2 gap-1.5">
            ${members.map(m => {
              const personalSpent = Math.round(owedMap[m.MemberId] || 0);
              const twdPersonal = defaultCurrency === 'THB' ? `≈ NT$ ${Math.round(personalSpent * thbToTwdRate)}` : '';
              return `
                <div class="bg-amber-50/50 border border-amber-100 p-2 rounded-lg text-xs flex items-center justify-between">
                  <span class="font-bold text-slate-700 truncate">${m.Avatar} ${m.Name}</span>
                  <div class="text-right flex-shrink-0">
                    <span class="font-extrabold text-amber-700 block">${currSymbol}${personalSpent}</span>
                    ${twdPersonal ? `<span class="text-[9px] text-slate-400 block">${twdPersonal}</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">建議結算找補路徑</span>
      `;

      if (transactions.length === 0) {
        resultHtml += `<div class="text-xs font-bold text-emerald-700 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> 目前所有成員帳目完美平衡，互不相欠！</div>`;
      } else {
        resultHtml += `<div class="space-y-1.5">`;
        transactions.forEach(t => {
          const fromMember = memberMap[t.from] || { Name: t.from, Avatar: '👤' };
          const toMember = memberMap[t.to] || { Name: t.to, Avatar: '👤' };
          const twdEst = defaultCurrency === 'THB' ? `(約 NT$ ${Math.round(t.amount * thbToTwdRate)})` : '';

          resultHtml += `
            <div class="text-xs font-bold text-slate-800 flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-200/70">
              <div class="flex items-center gap-1.5">
                <span>${fromMember.Avatar} <strong>${fromMember.Name}</strong></span>
                <i class="fa-solid fa-arrow-right text-amber-500 text-[10px]"></i>
                <span>${toMember.Avatar} <strong>${toMember.Name}</strong></span>
              </div>
              <div class="text-right">
                <span class="text-rose-600 font-extrabold text-sm">${currSymbol}${t.amount}</span>
                <span class="text-[10px] text-slate-400 font-normal ml-0.5">${twdEst}</span>
              </div>
            </div>
          `;
        });
        resultHtml += `</div>`;
      }

      summaryEl.innerHTML = resultHtml;
    }

    // 6. 新增消費紀錄並寫入 GAS
    async function addExpense() {
      const amountInput = document.getElementById('expense-amount');
      const noteInput = document.getElementById('expense-note');
      const categorySelect = document.getElementById('expense-category');

      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        alert('請輸入有效的消費金額！');
        return;
      }

      const newExpense = {
        ExpenseId: 'E' + Date.now().toString().slice(-6),
        Timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Bangkok' }),
        PayerId: selectedPayerId,
        Amount: amount,
        Category: categorySelect.value,
        Note: noteInput.value.trim() || categorySelect.value,
        SplitWith: selectedSplitters.join(',')
      };

      // 樂觀更新 (UI 快速反應)
      expenses.push(newExpense);
      renderExpenses();

      // 清空輸入框
      amountInput.value = '';
      noteInput.value = '';

      // 自動切換到明細列表
      switchTab('list');

      // 同步 POST 到 Google Sheets
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'addExpense', data: newExpense })
        });
      } catch (err) {
        console.error('寫入 Google Sheet 失敗:', err);
      }
    }

    // 7. 載入基本行程資訊
    async function fetchItinerary() {
      const itineraryEl = document.getElementById('itinerary-list');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          itineraryEl.innerHTML = data.map(item => `
            <div class="border-b border-slate-100 py-2 flex justify-between items-center text-left">
              <div>
                <span class="font-bold text-slate-800">${item.Title || item.title || '行程活動'}</span>
                <p class="text-[10px] text-slate-400">${item.Time || ''} ${item.Location || ''}</p>
              </div>
              ${item.Lat ? `<a href="${item.MapUrl || '#'}" target="_blank" class="text-indigo-500 font-bold text-[11px]"><i class="fa-solid fa-location-dot"></i> 地圖</a>` : ''}
            </div>
          `).join('');
        } else {
          itineraryEl.innerText = '尚無行程資料';
        }
      } catch (e) {
        itineraryEl.innerText = '無法載入行程，請確認 API 網址';
      }
    }
  </script>
</body>
</html>
