<script>
  // 💡 請在此處貼上你的 Apps Script Web App 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbwP45SIT0FQvb2sziA2y2fkhFxIzjsVwrWY0JwaOBCUG7k6w4PuJpEEkt6ks66eYkd0SA/exec";

  const categoryBadgeStyles = {
    "交通": "bg-slate-900/80 text-white",
    "景點": "bg-emerald-600 text-white",
    "美食": "bg-amber-500 text-white",
    "購物": "bg-purple-600 text-white",
    "放鬆": "bg-sky-600 text-white"
  };

  // 預設 9 天基本結構
  const defaultDays = [
    { dayId: "day-1", dayLabel: "D1", date: "10/09", fullDate: "10/09 (五)", title: "行程規劃中" },
    { dayId: "day-2", dayLabel: "D2", date: "10/10", fullDate: "10/10 (六)", title: "行程規劃中" },
    { dayId: "day-3", dayLabel: "D3", date: "10/11", fullDate: "10/11 (日)", title: "行程規劃中" },
    { dayId: "day-4", dayLabel: "D4", date: "10/12", fullDate: "10/12 (一)", title: "行程規劃中" },
    { dayId: "day-5", dayLabel: "D5", date: "10/13", fullDate: "10/13 (二)", title: "行程規劃中" },
    { dayId: "day-6", dayLabel: "D6", date: "10/14", fullDate: "10/14 (三)", title: "行程規劃中" },
    { dayId: "day-7", dayLabel: "D7", date: "10/15", fullDate: "10/15 (四)", title: "行程規劃中" },
    { dayId: "day-8", dayLabel: "D8", date: "10/16", fullDate: "10/16 (五)", title: "行程規劃中" },
    { dayId: "day-9", dayLabel: "D9", date: "10/17", fullDate: "10/17 (六)", title: "行程規劃中" }
  ];

  async function fetchAndRenderItinerary() {
    try {
      const response = await fetch(API_URL);
      const rawData = await response.json();

      // 將平鋪的 Sheet 資料按 DayId 分組轉換
      const daysMap = {};
      defaultDays.forEach(d => {
        daysMap[d.dayId] = { ...d, events: [] };
      });

      rawData.forEach(row => {
        const dayKey = row.DayId || row.dayId;
        if (daysMap[dayKey]) {
          if (row.DayTitle) daysMap[dayKey].title = row.DayTitle;
          
          daysMap[dayKey].events.push({
            time: row.Time || "",
            category: row.Category || "景點",
            title: row.Title || "未命名行程",
            subtitle: row.Subtitle || "",
            image: row.Image || "https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=600&q=80",
            notes: row.Notes ? row.Notes.split(';') : [],
            mapUrl: row.MapUrl || "https://maps.google.com"
          });
        }
      });

      renderUI(Object.values(daysMap));
    } catch (error) {
      console.error("載入行程資料失敗:", error);
    }
  }

  function renderUI(itineraryData) {
    const navContainer = document.getElementById("day-nav-container");
    const itineraryContainer = document.getElementById("itinerary-container");

    navContainer.innerHTML = "";
    itineraryContainer.innerHTML = "";

    itineraryData.forEach((day, index) => {
      // 1. 渲染頂部導覽列按鈕
      const navBtn = document.createElement("a");
      navBtn.href = `#${day.dayId}`;
      navBtn.className = `flex-shrink-0 px-4 py-2 rounded-lg text-xs text-center font-bold transition ${
        index === 0 ? "bg-slate-900 text-white" : "bg-slate-100 hover:bg-slate-200 text-slate-700"
      }`;
      navBtn.innerHTML = `${day.dayLabel}<span class="block font-normal text-[10px] ${index === 0 ? "opacity-80" : "text-slate-500"}">${day.date}</span>`;
      navContainer.appendChild(navBtn);

      // 2. 渲染每日行程卡片
      const section = document.createElement("section");
      section.id = day.dayId;
      section.className = "scroll-mt-28";

      let eventsHtml = "";
      if (day.events.length === 0) {
        eventsHtml = `
          <div class="bg-white p-6 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-sm">
            <i class="fa-solid fa-pen-to-square mr-1"></i> 行程規劃中...
          </div>
        `;
      } else {
        eventsHtml = day.events.map(event => `
          <article class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-100 flex flex-col md:flex-row mb-4">
            <div class="md:w-1/3 h-48 md:h-auto relative bg-slate-200">
              <img src="${event.image}" alt="${event.title}" class="w-full h-full object-cover">
              <span class="absolute top-3 left-3 ${categoryBadgeStyles[event.category] || "bg-slate-800 text-white"} text-xs px-2.5 py-1 rounded-md font-medium">
                ${event.category}
              </span>
            </div>
            <div class="p-5 md:w-2/3 flex flex-col justify-between">
              <div>
                <p class="text-xs font-bold text-slate-400 mb-1">${event.time}</p>
                <h3 class="text-lg font-bold text-slate-800">${event.title}</h3>
                <p class="text-xs text-slate-500 mb-3">${event.subtitle}</p>
                ${event.notes.length > 0 ? `
                  <ul class="text-xs text-slate-600 space-y-1 mb-4 list-disc list-inside bg-slate-50 p-3 rounded-lg border border-slate-100">
                    ${event.notes.map(note => `<li>${note}</li>`).join('')}
                  </ul>
                ` : ''}
              </div>
              <div class="flex gap-2 pt-2 border-t border-slate-100">
                <a href="${event.mapUrl}" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center gap-1">
                  <i class="fa-solid fa-location-dot text-red-500"></i> Google Maps
                </a>
              </div>
            </div>
          </article>
        `).join('');
      }

      section.innerHTML = `
        <div class="mb-4">
          <span class="text-xs font-bold text-amber-600 tracking-wider">DAY 0${index + 1} · ${day.fullDate}</span>
          <h2 class="text-2xl font-black text-slate-900">${day.title}</h2>
        </div>
        <div class="space-y-4">${eventsHtml}</div>
      `;

      itineraryContainer.appendChild(section);
    });
  }

  // 頁面載入時自動向 API 抓取資料
  fetchAndRenderItinerary();
</script>
